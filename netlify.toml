# Netlify configuration — this site is fully static, no build step needed.
# Deploy: push this folder to GitHub and import it on Netlify,
# or drag-and-drop the folder at https://app.netlify.com/drop
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
